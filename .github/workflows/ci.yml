name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no dependencies and no build step, so there is nothing to install.
      - name: Syntax check
        run: npm run check

      - name: Offline bridge test (no DSH required)
        run: npm test

      - name: Packaged artifact is self-sufficient
        run: npm run verify:pack
